<!--
  CANONICAL SOURCE — April9 stakeholder one-pager renderer (shared/human-output-template.html).
  sync-agents.js inlines this file into referencing commands at sync time.
  Edit ONLY this file to change the page design; never edit the expanded copies in ~/.claude.

  This template is a GENERIC RENDERER, not a page to fill in by hand. It has two substitution
  points: {{HUMANIZED_SPEC_JSON}}, which takes the contents of humanized-spec.json verbatim, and
  {{RELEASE_NAME}} in <title>, which tooling reads statically before the renderer runs.
  Never hardcode a feature, story, persona or heading into the body: add it to the JSON.
  Every asset is inline: no font, script, or image may be FETCHED at render time, so the page
  renders from disk with no network access (the inline renderer script below is not a fetch).
-->
<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{RELEASE_NAME}} — User Stories</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e2e5ea;
    --ink: #14181f;
    --ink-soft: #55606f;
    --accent: #4c5fd7;
    --chip-bg: #eceef2;
    --chip-ink: #55606f;
    --p1-bg: #fdeaea;
    --p1-ink: #a3282b;
    --p2-bg: #eaf1fd;
    --p2-ink: #2b4ba3;
    --p3-bg: #eaf5ee;
    --p3-ink: #23663f;
    --p4-bg: #f3eefa;
    --p4-ink: #5a3b8c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --surface: #1c2028;
      --border: #2c3240;
      --ink: #eef1f6;
      --ink-soft: #a3adbd;
      --accent: #93a1f5;
      --chip-bg: #2c3240;
      --chip-ink: #a3adbd;
      --p1-bg: #3b2124;
      --p1-ink: #f2a8ab;
      --p2-bg: #1f2a45;
      --p2-ink: #a8bdf2;
      --p3-bg: #1c3328;
      --p3-ink: #93d9ae;
      --p4-bg: #2b2340;
      --p4-ink: #c4aef0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 52rem; margin: 0 auto; }
  header { border-bottom: 2px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.9rem; letter-spacing: -.02em; }
  .subtitle { margin: 0; color: var(--ink-soft); }
  .subtitle strong { color: var(--accent); }
  .feature {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem 1.5rem;
    margin-bottom: 1.25rem;
  }
  h2.system {
    margin: 2rem 0 1rem;
    font-size: 1.05rem;
    letter-spacing: .02em;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--border);
    padding-bottom: .5rem;
  }
  h2.system strong { color: var(--accent); }
  .feature h2 { margin: 0 0 .25rem; font-size: 1.15rem; }
  .feature h2 .num { color: var(--ink-soft); font-weight: 400; font-variant-numeric: tabular-nums; }
  .feature > .purpose { margin: 0 0 1.25rem; color: var(--ink-soft); font-size: .95rem; }
  .story {
    border-left: 3px solid var(--border);
    padding: .1rem 0 .1rem 1rem;
    margin: 0 0 1rem;
  }
  .story:last-child { margin-bottom: 0; }
  .story h3 { margin: 0 0 .35rem; font-size: 1rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline; }
  .tag {
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: .15rem .45rem;
    border-radius: 4px;
    white-space: nowrap;
    background: var(--chip-bg);
    color: var(--chip-ink);
  }
  .tag.p1 { background: var(--p1-bg); color: var(--p1-ink); }
  .tag.p2 { background: var(--p2-bg); color: var(--p2-ink); }
  .tag.p3 { background: var(--p3-bg); color: var(--p3-ink); }
  .tag.p4 { background: var(--p4-bg); color: var(--p4-ink); }
  .story p { margin: 0 0 .35rem; }
  .story p:last-child { margin-bottom: 0; }
  .story .fix { color: var(--ink-soft); }
  .story .fix b { color: var(--ink); }
  footer {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 2px solid var(--border);
    color: var(--ink-soft);
    font-size: .95rem;
  }
  footer strong { color: var(--ink); }
  .render-error {
    background: var(--surface);
    border: 1px solid var(--p1-ink);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    color: var(--ink);
  }
  @media print {
    body { background: #fff; padding: 0; }
    .feature { break-inside: avoid; border-color: #ccc; }
  }
</style>
</head>
<body>
<main id="one-pager">
  <noscript>
    <p class="render-error">This page renders its content with an inline script. Enable JavaScript, or read <code>humanized-spec.json</code> directly.</p>
  </noscript>
</main>

<script type="application/json" id="humanized-spec-data">
{{HUMANIZED_SPEC_JSON}}
</script>

<script>
(() => {
  const PRIORITY_CLASSES = ['P1', 'P2', 'P3', 'P4'];
  const root = document.getElementById('one-pager');

  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  };

  const text = (value) => document.createTextNode(value);

  const count = (n, singular, plural) => `${n} ${n === 1 ? singular : plural}`;

  const sentenceList = (items) =>
    items.length < 2 ? (items[0] || '') : `${items.slice(0, -1).join(', ')} and ${items[items.length - 1]}`;

  const storyRef = (feature, story) => `${feature.number}-${story.id}`;

  /** Appends " — the <strong>Persona</strong>" style attribution, skipping it when no persona is known. */
  const appendPersona = (node, persona, lead) => {
    if (!persona) return;
    node.append(text(lead), el('strong', null, persona));
  };

  const buildHeader = (data) => {
    const header = el('header');
    header.append(el('h1', null, `${data.release} — User Stories`));

    const subtitle = el('p', 'subtitle');
    const features = count(data.featureCount, 'feature', 'features');
    const stories = count(data.storyCount, 'user story', 'user stories');

    if (data.systems.length > 1) {
      subtitle.append(text(`${features}, ${stories} across ${sentenceList(data.systems.map((s) => s.label))}.`));
    } else {
      subtitle.append(text(`${features}, ${stories}.`));
      appendPersona(subtitle, data.systems[0] && data.systems[0].persona, ' One persona throughout: ');
      if (data.systems[0] && data.systems[0].persona) subtitle.append(text('.'));
    }

    header.append(subtitle);
    return header;
  };

  const buildStory = (story) => {
    const block = el('div', 'story');
    const heading = el('h3', null, story.title);
    const priority = PRIORITY_CLASSES.includes(story.priority) ? ` ${story.priority.toLowerCase()}` : '';
    heading.append(el('span', `tag${priority}`, `${story.id} · ${story.priority}`));
    block.append(heading, el('p', null, story.problem));

    const fix = el('p', 'fix');
    fix.append(el('b', null, 'Fix:'), text(` ${story.fix}`));
    block.append(fix);
    return block;
  };

  const buildFeature = (feature, position) => {
    const section = el('section', 'feature');
    const heading = el('h2');
    heading.append(
      el('span', 'num', `${position}.`),
      text(` ${feature.name} `),
      el('span', 'num', `(${feature.number})`)
    );
    section.append(heading);
    if (feature.purpose) section.append(el('p', 'purpose', feature.purpose));
    feature.stories.forEach((story) => section.append(buildStory(story)));
    return section;
  };

  const buildSystemHeading = (system) => {
    const heading = el('h2', 'system', system.label);
    appendPersona(heading, system.persona, ' — the ');
    return heading;
  };

  const buildFooter = (data) => {
    const stories = data.systems.flatMap((system) =>
      system.features.flatMap((feature) => feature.stories.map((story) => ({ feature, story })))
    );
    const changing = stories.filter(({ story }) => story.changesData);

    const footer = el('footer');
    const line = el('p');

    if (changing.length === 0) {
      line.append(el('strong', null, 'No story changes data.'), text(' Every story is display, filtering or visibility.'));
    } else {
      const refs = changing.map(({ feature, story }) => storyRef(feature, story)).join(', ');
      line.append(el('strong', null, 'Data-changing stories:'), text(` ${refs}.`));
      if (changing.length < stories.length) line.append(text(' Everything else is display, filtering or visibility.'));
    }

    footer.append(line);
    return footer;
  };

  const render = (data) => {
    root.replaceChildren(buildHeader(data));

    let position = 1;
    data.systems.forEach((system) => {
      if (data.systems.length > 1) root.append(buildSystemHeading(system));
      system.features.forEach((feature) => root.append(buildFeature(feature, position++)));
    });

    root.append(buildFooter(data));
    document.title = `${data.release} — User Stories`;
  };

  try {
    render(JSON.parse(document.getElementById('humanized-spec-data').textContent));
  } catch (error) {
    root.replaceChildren(
      el('p', 'render-error', `This page could not read its embedded humanized-spec.json data: ${error.message}`)
    );
  }
})();
</script>
</body>
</html>
